[project]
name = "dashboard-refresh-microservice"
version = "0.1.0"
description = "Asynchronous dashboard snapshot refresh microservice."
requires-python = ">=3.11"
dependencies = [
  "aio-pika>=9.4.3",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "mcp>=1.0.0",
  "pydantic-settings>=2.3.4",
  "sqlalchemy[asyncio]>=2.0.31",
  "uvicorn[standard]>=0.30.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
