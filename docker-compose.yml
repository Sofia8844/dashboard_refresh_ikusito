services:
  refresh-migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    restart: "no"

  refresh-api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      refresh-migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  refresh-worker:
    build: .
    command: python worker.py
    env_file: .env
    depends_on:
      refresh-migrate:
        condition: service_completed_successfully
